# ngsnap default spec: the house style (P5).
# `template` overrides go into the viewer state; `config` overrides are
# render-time client config-state knobs; `respects` names what the spec
# deliberately leaves to the author.

respects = [
    "crossSectionScale",
    "layers[].segments",
    "layers[].visible",
    "position",
    "projectionScale",
]

[template]
crossSectionBackgroundColor = "#000000"
projectionBackgroundColor = "#000000"
showAxisLines = false
showDefaultAnnotations = false
showScaleBar = true

# Hidden panels still reserve width in the viewer, leaving a black bar.
[template.helpPanel]
visible = false

[template.layerListPanel]
visible = false

[template.selectedLayer]
visible = false

[template.selection]
visible = false

[template.settingsPanel]
visible = false

[template.statistics]
visible = false

[config]
showPanelBorders = false
showUIControls = false
viewerSize = [1600, 1200]

[config.scaleBarOptions]
scaleFactor = 1
