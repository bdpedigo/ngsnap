# ngsnap default house style (P5).
# `template` overrides go into the viewer state; `config` overrides are
# render-time client config-state knobs; `respects` names what the style
# deliberately leaves to the author.

respects = [
    "layers[].visible",
    "layers[].segments",
    "position",
    "crossSectionScale",
    "projectionScale",
]

[template]
showScaleBar = true
showAxisLines = false
showDefaultAnnotations = false
crossSectionBackgroundColor = "#000000"
projectionBackgroundColor = "#000000"

[config]
showUIControls = false
showPanelBorders = false
viewerSize = [1600, 1200]

[config.scaleBarOptions]
scaleFactor = 1
