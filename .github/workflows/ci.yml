name: CI

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  python-version: "3.13"
            - name: Install dependencies
              run: uv sync
            - name: Lint
              run: uv run ruff check .
            - name: Format check
              run: uv run ruff format --check .
            - name: Test
              run: uv run pytest

    browser:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  python-version: "3.13"
            - name: Install dependencies with the render extra
              run: uv sync --extra render
            - name: Install the pinned Chrome for Testing browser
              run: uv run python -c "from ngsnap.render import install_browser; install_browser()"
            - name: Browser integration tests
              run: uv run pytest -m browser
